name: Update Weekly Rating Race

on:
  schedule:
    # Runs every 3 hours in UTC at minute 17.
    - cron: "17 */3 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-rating-race
  cancel-in-progress: false

jobs:
  update-weekly-ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Update weekly rating race
        env:
          CHESS_API_CONTACT: ${{ secrets.CHESS_API_CONTACT }}
        run: node scripts/update-weekly-rating-race.mjs

      - name: Save updated rating data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/weekly-rating-state.json weekly-rating-race.json
          git diff --cached --quiet || git commit -m "Update weekly rating race"
          git push
